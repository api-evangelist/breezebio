name: Breezebio
description: >-
  BreezeBio (formerly GenEdit) is a South San Francisco genetic-medicine company
  developing precision-delivered nucleic acid therapies for autoimmune disease and
  oncology. Its proprietary NanoGalaxy platform uses non-lipid, hydrophilic polymer
  nanoparticles of tunable size, charge, and composition to selectively deliver DNA,
  RNA, and ribonucleoprotein payloads to specific tissues and cell types beyond the
  liver — including immune cells and targets in the heart, lung, and central nervous
  system. The company is advancing an internal therapeutic pipeline led by BRZ-101,
  which aims to restore immune tolerance in type 1 diabetes, and in February 2026
  closed a $60M Series B backed by DCVC Bio, Sequoia Capital, and other investors.
  BreezeBio is a research-stage biopharmaceutical company and does not currently
  publish a public developer API, SDKs, or API documentation; this profile tracks
  its corporate and identity surface within the API Evangelist network.
